
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #1e1e1e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: white;
}

.calculator {
    width: 340px;
    background: #2a2a2a;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,.4);
}

h2 {
    text-align: center;
    margin-top: 0;
}

#display {
    width: 100%;
    box-sizing: border-box;
    height: 70px;
    border: none;
    border-radius: 10px;
    font-size: 32px;
    text-align: right;
    padding: 12px;
    margin-bottom: 12px;
    background: #f5f5f5;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 8px;
}

button {
    height: 60px;
    border: none;
    border-radius: 10px;
    font-size: 22px;
    cursor: pointer;
    transition: 0.15s;
}

button:hover {
    transform: scale(1.03);
}

.operator {
    background: #ff9500;
    color: white;
}

.utility {
    background: #666;
    color: white;
}

.number {
    background: #444;
    color: white;
}

.equals {
    background: #28a745;
    color: white;
}

.footer {
    text-align: center;
    margin-top: 12px;
    font-size: 12px;
    color: #bbb;
}
</style>
</head>

<body>

<div class="calculator">

<h2>Calculator</h2>

<input
    id="display"
    type="text"
    readonly
    value="0"
    aria-label="Calculator Display"
>

<div class="buttons">

<button class="utility" onclick="append('(')">(</button>
<button class="utility" onclick="append(')')">)</button>
<button class="utility" onclick="backspace()">⌫</button>
<button class="utility" onclick="clearAll()">C</button>

<button class="number" onclick="append('7')">7</button>
<button class="number" onclick="append('8')">8</button>
<button class="number" onclick="append('9')">9</button>
<button class="operator" onclick="append('/')">÷</button>

<button class="number" onclick="append('4')">4</button>
<button class="number" onclick="append('5')">5</button>
<button class="number" onclick="append('6')">6</button>
<button class="operator" onclick="append('*')">×</button>

<button class="number" onclick="append('1')">1</button>
<button class="number" onclick="append('2')">2</button>
<button class="number" onclick="append('3')">3</button>
<button class="operator" onclick="append('-')">−</button>

<button class="number" onclick="append('0')">0</button>
<button class="number" onclick="append('.')">.</button>
<button class="equals" onclick="calculate()">=</button>
<button class="operator" onclick="append('+')">+</button>

</div>

<div class="footer">
Free • No Ads • No Distractions
</div>

</div>

<script>

let expression = "";

const display =
    document.getElementById("display");

function updateDisplay() {
    display.value =
        expression || "0";
}

function append(value) {

    if (expression === "Error") {
        expression = "";
    }

    expression += value;
    updateDisplay();
}

function clearAll() {
    expression = "";
    updateDisplay();
}

function backspace() {

    if (expression === "Error") {
        expression = "";
    } else {
        expression =
            expression.slice(0, -1);
    }

    updateDisplay();
}

function precedence(op) {

    if (
        op === "+" ||
        op === "-"
    ) return 1;

    if (
        op === "*" ||
        op === "/"
    ) return 2;

    return 0;
}

function tokenize(expr) {

    return expr.match(
        /\d+(\.\d+)?|[()+\-*/]/g
    ) || [];
}

function toRPN(tokens) {

    const output = [];
    const operators = [];

    for (const token of tokens) {

        if (!isNaN(token)) {

            output.push(token);

        } else if (token === "(") {

            operators.push(token);

        } else if (token === ")") {

            while (
                operators.length &&
                operators.at(-1) !== "("
            ) {
                output.push(
                    operators.pop()
                );
            }

            operators.pop();

        } else {

            while (
                operators.length &&
                precedence(
                    operators.at(-1)
                ) >= precedence(token)
            ) {
                output.push(
                    operators.pop()
                );
            }

            operators.push(token);
        }
    }

    while (operators.length) {
        output.push(
            operators.pop()
        );
    }

    return output;
}

function evaluateRPN(rpn) {

    const stack = [];

    for (const token of rpn) {

        if (!isNaN(token)) {

            stack.push(
                Number(token)
            );

            continue;
        }

        const b = stack.pop();
        const a = stack.pop();

        switch (token) {

            case "+":
                stack.push(a + b);
                break;

            case "-":
                stack.push(a - b);
                break;

            case "*":
                stack.push(a * b);
                break;

            case "/":

                if (b === 0) {
                    throw Error();
                }

                stack.push(a / b);
                break;
        }
    }

    return stack[0];
}

function calculate() {

    try {

        const tokens =
            tokenize(expression);

        const rpn =
            toRPN(tokens);

        const result =
            evaluateRPN(rpn);

        expression =
            parseFloat(
                result.toFixed(10)
            ).toString();

    }
    catch {

        expression = "Error";
    }

    updateDisplay();
}

window.addEventListener(
    "keydown",
    (e) => {

        const key = e.key;

        if (
            /^[0-9]$/.test(key)
        ) {
            append(key);
        }

        else if (
            "+-*/().".includes(key)
        ) {
            append(key);
        }

        else if (
            key === "Enter" ||
            key === "="
        ) {
            e.preventDefault();
            calculate();
        }

        else if (
            key === "Backspace"
        ) {
            backspace();
        }

        else if (
            key === "Escape"
        ) {
            clearAll();
        }
    }
);

</script>

</body>
</html>
