<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four Function Calculator</title>
</head>
<body>

<p><strong>Calculator Online, 4 functions</strong><br>
No ads, no distractions, for everyone! Free!<br>
Made on&nbsp;1:27:31 PM&nbsp;06/01/2026</p>
<hr>

<!-- simple four function calculator - no css, no extra fluff -->
<div>
    <!-- display -->
    <input type="text" id="display" readonly style="font-size:24px;width:250px;text-align:right;padding:8px;margin-bottom:8px;background:#f5f5f5;border:1px solid #aaa;" value="0">
    <br>

    <!-- buttons -->
    <button id="btn7">7</button>
    <button id="btn8">8</button>
    <button id="btn9">9</button>
    <button id="btnDivide">/</button><br>

    <button id="btn4">4</button>
    <button id="btn5">5</button>
    <button id="btn6">6</button>
    <button id="btnMultiply">*</button><br>

    <button id="btn1">1</button>
    <button id="btn2">2</button>
    <button id="btn3">3</button>
    <button id="btnSubtract">-</button><br>

    <button id="btn0">0</button>
    <button id="btnDecimal">.</button>
    <button id="btnClear">C</button>
    <button id="btnAdd">+</button><br>

    <button id="btnEquals" style="width:180px;">=</button>
    <button id="btnBackspace">⌫</button>
</div>

<hr>
<small>Free • No ads • No distractions</small>

<script>
    // four function calculator - simple and clean
    let current = "0";
    let previous = null;
    let operator = null;
    let waitingForOperand = false;

    const display = document.getElementById("display");

    function updateDisplay() {
        display.value = current;
    }

    function inputDigit(digit) {
        if (waitingForOperand) {
            current = digit;
            waitingForOperand = false;
        } else {
            current = current === "0" ? digit : current + digit;
        }
        updateDisplay();
    }

    function inputDecimal() {
        if (waitingForOperand) {
            current = "0.";
            waitingForOperand = false;
            updateDisplay();
            return;
        }
        if (!current.includes(".")) {
            current = current + ".";
            updateDisplay();
        }
    }

    function clearAll() {
        current = "0";
        previous = null;
        operator = null;
        waitingForOperand = false;
        updateDisplay();
    }

    function backspace() {
        if (waitingForOperand) return;
        if (current.length === 1 || (current.length === 2 && current.startsWith("-"))) {
            current = "0";
        } else {
            current = current.slice(0, -1);
            if (current === "" || current === "-") current = "0";
        }
        updateDisplay();
    }

    function performOperation() {
        if (operator === null || previous === null || waitingForOperand) return;
        let result;
        const prev = parseFloat(previous);
        const curr = parseFloat(current);
        
        if (isNaN(prev) || isNaN(curr)) {
            clearAll();
            return;
        }
        
        switch (operator) {
            case "+":
                result = prev + curr;
                break;
            case "-":
                result = prev - curr;
                break;
            case "*":
                result = prev * curr;
                break;
            case "/":
                if (curr === 0) {
                    current = "Error";
                    previous = null;
                    operator = null;
                    waitingForOperand = true;
                    updateDisplay();
                    return;
                }
                result = prev / curr;
                break;
            default:
                return;
        }
        
        // clean up floating point
        current = parseFloat(result.toFixed(10)).toString();
        if (current.includes(".") && current.endsWith(".0")) current = current.slice(0, -2);
        previous = null;
        operator = null;
        waitingForOperand = true;
        updateDisplay();
    }

    function setOperator(op) {
        if (current === "Error") {
            clearAll();
        }
        
        if (operator !== null && !waitingForOperand) {
            performOperation();
        }
        
        previous = current;
        operator = op;
        waitingForOperand = true;
    }

    function computeEquals() {
        if (current === "Error") {
            clearAll();
            return;
        }
        if (operator === null || waitingForOperand) return;
        performOperation();
    }

    // button bindings
    document.getElementById("btn0").onclick = () => inputDigit("0");
    document.getElementById("btn1").onclick = () => inputDigit("1");
    document.getElementById("btn2").onclick = () => inputDigit("2");
    document.getElementById("btn3").onclick = () => inputDigit("3");
    document.getElementById("btn4").onclick = () => inputDigit("4");
    document.getElementById("btn5").onclick = () => inputDigit("5");
    document.getElementById("btn6").onclick = () => inputDigit("6");
    document.getElementById("btn7").onclick = () => inputDigit("7");
    document.getElementById("btn8").onclick = () => inputDigit("8");
    document.getElementById("btn9").onclick = () => inputDigit("9");
    document.getElementById("btnDecimal").onclick = () => inputDecimal();
    document.getElementById("btnClear").onclick = () => clearAll();
    document.getElementById("btnBackspace").onclick = () => backspace();
    document.getElementById("btnAdd").onclick = () => setOperator("+");
    document.getElementById("btnSubtract").onclick = () => setOperator("-");
    document.getElementById("btnMultiply").onclick = () => setOperator("*");
    document.getElementById("btnDivide").onclick = () => setOperator("/");
    document.getElementById("btnEquals").onclick = () => computeEquals();

    // keyboard support
    window.addEventListener("keydown", (e) => {
        const key = e.key;
        if (/^[0-9]$/.test(key)) {
            e.preventDefault();
            inputDigit(key);
        } else if (key === ".") {
            e.preventDefault();
            inputDecimal();
        } else if (key === "+") {
            e.preventDefault();
            setOperator("+");
        } else if (key === "-") {
            e.preventDefault();
            setOperator("-");
        } else if (key === "*") {
            e.preventDefault();
            setOperator("*");
        } else if (key === "/") {
            e.preventDefault();
            setOperator("/");
        } else if (key === "Enter" || key === "=") {
            e.preventDefault();
            computeEquals();
        } else if (key === "Escape") {
            e.preventDefault();
            clearAll();
        } else if (key === "Backspace") {
            e.preventDefault();
            backspace();
        } else if (key === "Delete") {
            e.preventDefault();
            clearAll();
        }
    });
</script>

</body>
</html>
